{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora Certa - Home</title>

    <link rel="stylesheet" href="{% static 'base.css' %}">
    <link rel="stylesheet" href="{% static 'home.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="{% static 'logo.png' %}" class="logo-icon" alt="Logo Hora Certa">
      <span class="Hora">Hora</span><span class="Certa">Certa</span>
    </div>
    <nav>
      <a href="{% url 'kaylane_home' %}" class="ativo">Início</a>
      <a href="{% url 'criar_evento' %}">Eventos</a>
      <a href="{% url 'resumo_horas' %}">Resumo de Horas</a>
      <a href="{% url 'perfil' %}">Perfil</a>
      <!-- Botão de modo escuro -->
      <button id="theme-toggle" class="theme-toggle">Modo escuro</button>
    </nav>
  </header>

  <main class="container main-content">
    <div class="card home-card">
      <h2 class="home-title">{{ home.titulo }}</h2>
      <p class="home-subtitle">{{ home.subtitulo }}</p>
      <p class="home-texto">{{ home.texto_principal }}</p>

      <div class="home-actions">
        <a href="{% url 'criar_evento' %}" class="btn">Ver eventos disponíveis</a>
        <a href="{% url 'resumo_horas' %}" class="btn btn-secondary">Ver meu resumo de horas</a>
      </div>
    </div>
  </main>

  <script src="{% static 'theme.js' %}"></script>
</body>
</html>
