{% load static %}
<link rel="stylesheet" href="{% static 'base.css' %}">
<link rel="stylesheet" href="{% static 'criar_evento.css' %}">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hora Certa - Criação de Evento</title>
  <link rel="stylesheet" href="{% static 'style_kaylane.css' %}">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="{% static 'logo.png' %}" class="logo-icon" alt="Logo Hora Certa">
      <span class="Hora">Hora</span><span class="Certa">Certa</span>
    </div>
    <nav>
      <a href="{% url 'kaylane_home' %}">Início</a>
      <a href="{% url 'criar_evento' %}">Eventos</a>
      <a href="#">Certificados</a>
      <a href="{% url 'perfil' %}">Perfil</a>
      <div class="avatar"></div>
    </nav>
  </header>

  <main class="container main-content">
    <div class="card">
      <h1>Criar evento</h1>
      <p class="subtitle">Preencha os campos abaixo para criar um novo evento.</p>

      {% if success %}
      <div class="alert success">
        Evento "{{ titulo }}" salvo com sucesso!
      </div>
      {% endif %}

      <form method="post" action="">
        {% csrf_token %}
        <label for="titulo">Título do evento*</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex: Palestra sobre Inteligência Artificial" required>

        <label for="descricao">Descrição do evento*</label>
        <textarea id="descricao" name="descricao" placeholder="Descreva o evento, palestrantes, temas abordados, etc." required></textarea>

        <div class="row">
          <div class="col">
            <label for="categoria">Categoria sugerida</label>
            <select id="categoria" name="categoria">
              <option value="" disabled selected>Selecione a categoria</option>
              <option value="Palestra">Palestra</option>
              <option value="Minicurso">Minicurso</option>
              <option value="Visita Técnica">Visita Técnica</option>
            </select>
          </div>

          <div class="col">
            <label for="formato">Formato</label>
            <select id="formato" name="formato" required>
              <option value="" disabled selected>Selecione o formato</option>
              <option value="presencial">Presencial</option>
              <option value="remoto">Remoto</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label for="data">Data*</label>
            <input type="date" id="data" name="data" required>
          </div>
          <div class="col">
            <label for="hora">Hora*</label>
            <input type="time" id="hora" name="hora" required>
          </div>
        </div>

        <label for="link">Link de inscrição</label>
        <input type="url" id="link" name="link" placeholder="https://exemplo.com/inscricao">

        <label for="requisitos">Requisitos para comprovação</label>
        <textarea id="requisitos" name="requisitos" placeholder="Descreva os requisitos para comprovação de horas complementares"></textarea>

        <button type="submit" class="btn">Salvar evento</button>
      </form>
    </div>
  </main>
</body>
</html>
